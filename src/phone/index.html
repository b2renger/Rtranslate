<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WhisperLive captions</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>

  <header id="bar" class="bar">
    <div class="bar-left">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <span id="status" class="status">Connecting…</span>
    </div>
    <div class="bar-right">
      <button id="btn-lang" class="chip" type="button" hidden></button>
      <button id="btn-smaller" class="chip" type="button" aria-label="Smaller text">A−</button>
      <button id="btn-bigger" class="chip" type="button" aria-label="Bigger text">A+</button>
      <button id="btn-full" class="chip" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </header>

  <main id="captions" class="captions" aria-live="polite"></main>

  <p id="hint" class="hint">Waiting for the desktop to start listening…</p>

  <div id="toast" class="toast" hidden></div>

  <script src="phone.js"></script>
</body>
</html>

appId: com.b2renger.rtranslate
productName: Rtranslate
copyright: Copyright © 2026 b2renger

directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.md"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Auto-update needs the app to be able to replace itself without elevation,
  # which a per-user install gives us for free.
  differentialPackage: true

# ---------------------------------------------------------------------------
# Auto-update
#
# electron-updater reads this block at build time and bakes it into
# app-update.yml inside the package. Publishing a GitHub Release with the
# installer plus latest.yml attached is all a running app needs to find it.
#
#   1. Create the repo and push:
#        gh repo create b2renger/Rtranslate --private --source=. --remote=origin
#        git push -u origin main
#   2. Set a token with repo scope:  $env:GH_TOKEN = "ghp_..."
#   3. Bump "version" in package.json, then:  npm run release
#
# electron-builder tags, creates a draft release, and uploads the installer,
# latest.yml and the blockmap. Publish the draft and every installed copy picks
# it up within six hours, or on next launch.
#
# Self-hosting instead of GitHub: swap the block below for
#   provider: generic
#   url: https://your.host/rtranslate/
# and copy the same three files there.
#
# Unsigned builds update fine, but Windows SmartScreen will warn on first run.
# A code-signing certificate removes that; it is the only thing missing here.
# ---------------------------------------------------------------------------
publish:
  provider: github
  owner: b2renger
  repo: Rtranslate
  releaseType: draft

# ---------------------------------------------------------------------------
# The Python environment is NOT in this package, by design.
#
# The CUDA PyTorch stack is 3-4 GB - far too much for an installer. Instead the
# app builds it on first run into app.getPath('userData')/pyenv, driven by
# src/main/envSetup.js with a visible step-by-step UI. See "First run" in the
# README.
#
# The one thing that stage cannot do is choose your model weights: those are
# fetched by WhisperLiveKit itself the first time a session starts, which is why
# the first Start takes noticeably longer than later ones.
# ---------------------------------------------------------------------------
